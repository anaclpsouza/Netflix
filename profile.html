<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Quem está assistindo?</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="profiles-body">

  <header class="profiles-header">
    <img src="https://occ.a.nflxso.net/dnmt/api/v6/iL4oJVDYZ8KLSrJ6eG2OwtghbfQ/AAAAAZge2REfWoSoWRs31izjUdgihldMUslSHTdfz-1aT4vVrgJuVByU92G8wIrBkwULJHWjM1khpzW0xWndigQFYViKFpy-pM6NZFnTKEPkpf9hcdSzCyzqBbcouyIpmgVLbodhaeyqCXaS.svg" alt="Logo Netflix">
  </header>

  <main class="profiles-main">
    <div class="profiles-container">
      <h1>Quem está assistindo?</h1>
      
      <ul class="profiles-list">
        
        <li class="profile-item">
          <a href="home.html">
            <div class="profile-avatar">
              <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Avatar Perfil 1">
            </div>
            <span class="profile-name">João</span>
          </a>
        </li>
        
        <li class="profile-item">
          <a href="home.html">
            <div class="profile-avatar">
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_0ktq5pFEz71BIDJbH0XXC9STcigP68GQy0j4jxhmOg&s=10" alt="Avatar Perfil 2">
            </div>
            <span class="profile-name">Maria</span>
          </a>
        </li>

        <li class="profile-item add-profile">
          <a href="#">
            <div class="profile-avatar icon-wrapper">
              <i class="fa-solid fa-plus"></i>
            </div>
            <span class="profile-name">Adicionar perfil</span>
          </a>
        </li>

      </ul>

      <a href="#" class="btn-manage-profiles">Gerenciar perfis</a>
    </div>
  </main>

</body>
</html>
